<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>访问验证</title><style>body{font-family:-apple-system,"PingFang SC",sans-serif;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;margin:0;background:#fff;}.box{display:flex;flex-direction:column;align-items:center;width:280px;padding:40px 0;box-sizing:border-box;}.hero{width:140px;height:140px;margin-bottom:8px;}.title{margin:0;font-size:16px;font-weight:500;line-height:22px;color:#18191c;}input{width:160px;box-sizing:border-box;margin-top:8px;padding:6px 12px;border:0.5px solid #9499a0;border-radius:17px;font-size:16px;line-height:22px;color:#18191c;background:#fff;outline:none;text-align:center;}input::placeholder{color:#9499a0;}.err{color:#f25d8e;font-size:12px;margin-top:8px;min-height:16px;}.gate-btn{margin-top: 14px;padding:6px 20px;border:0;border-radius:8px;background:#00aeec;color:#fff;font-size:14px;line-height:20px;cursor:pointer;}</style></head><body><div class="box"><img class="hero" src="//i0.hdslb.com/bfs/app/71bc670852bfc90d0862fea3612528f909352cb8.png" alt=""/><p class="title">需要访问密码</p><input id="pw" type="password" placeholder="请输入访问密码" autocomplete="off"/><button id="go" class="gate-btn" type="button">确认</button><div class="err" id="err"></div></div><script>var slug="lumiscore-sdk-test";function submit(){var pw=document.getElementById("pw").value;fetch("/toy/verify",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"slug="+encodeURIComponent(slug)+"&password="+encodeURIComponent(pw)}).then(function(r){return r.json()}).then(function(d){var okv=d&&((d.data&&d.data.ok)||d.ok);if(okv){location.reload()}else{document.getElementById("err").textContent="密码错误"}}).catch(function(){document.getElementById("err").textContent="网络错误，请重试"})}document.getElementById("go").onclick=submit;document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")submit()});</script></body></html>
