          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.6L5.2 9l5.8 4.4v-3A5.6 5.6 0 1 1 5.4 16H3.4a7.6 7.6 0 1 0 7.6-9z" fill="currentColor" stroke="none"/><path d="M5.2 4.6v3.4" /></svg>
        </button>
        <button class="sh-pb__icon sh-pb__play" type="button" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="sh-pb__icon" type="button" aria-label="前进 10 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.6L18.8 9 13 13.4V10a5.6 5.6 0 1 0 5.6 6h2A7.6 7.6 0 1 1 13 7z" fill="currentColor" stroke="none"/><path d="M18.8 4.6V8" /></svg>
        </button>
        <span class="sh-pb__time" id="pb-time">0:00</span>
        <input type="range" class="sh-pb__seek" min="0" max="1000" value="0" aria-label="进度" />
        <div class="sh-pb__break"></div>
        <button class="sh-pb__icon sh-pb__vol" type="button" aria-label="音量" id="pb-vol"></button>
        <input type="range" class="sh-pb__mini-range" min="0" max="100" step="1" value="80" aria-label="音量滑杆" />
        <button class="sh-pb__speed" type="button" id="pb-speed">1×</button>
        <button class="sh-pb__panel-btn" type="button" id="pb-panel-btn" hidden>路径</button>
        <span class="sh-pb__zoom-icon" aria-hidden="true" id="pb-zoom-icon"></span>
        <input type="range" class="sh-pb__mini-range sh-pb__zoom" min="0" max="100" step="1" value="100" aria-label="缩放" />
        <button class="sh-pb__icon sh-pb__close" type="button" aria-label="收起">×</button>
      </div>
    </div>
  </div>

  <!-- ── 超宽屏（>2:1）行首折叠开关：标题行、播放控件行各一个 ── -->
  <button class="corner-collapse" type="button" id="collapse-title" hidden aria-label="折叠标题">‹</button>
  <button class="corner-collapse" type="button" id="collapse-player" hidden aria-label="折叠播放控件">‹</button>

  <!-- 路径 / 场景面板：底栏与页面之间（竖屏）或侧栏左侧（超宽屏）弹出 -->
  <div class="sh-pb-panel" id="pb-panel" hidden>
    <div class="sh-pb-panel__head">
      <span class="sh-pb-panel__title" id="pb-panel-title"></span>
      <button class="pb-panel__pin" type="button" id="pb-panel-pin" aria-label="钉住面板" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3v5l3 3v2h-6v6l-1 2-1-2v-6H5v-2l3-3V3h8m0-2H8c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 .28-.11.53-.29.71L6.3 12.1c-.19.19-.3.44-.3.7V14c0 .55.45 1 1 1h5v5.5c0 .32.18.62.46.77L12 22l.54-.73c.28-.15.46-.45.46-.77V15h5c.55 0 1-.45 1-1v-1.2c0-.26-.11-.51-.29-.71l-2.41-2.39A1 1 0 0 1 15 9V3h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </button>
    </div>
    <div class="sh-pb-panel__body" id="pb-panel-body"></div>
  </div>

  <script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
  <script src="compat.js"></script>
  <script src="toy-sdk.js"></script>
  <script src="export-test.js"></script>
  <script src="test.js"></script>
</body>
</html>
