  <style id="diag-style">
    /* ── 诊断首屏（纯内联，不依赖外部文件；专测平台集成问题） ── */
    #diag-screen{position:fixed;inset:0;z-index:2147483000;background:#101014;color:#e6e6ec;font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;overflow:auto;padding:14px 16px 30px;box-sizing:border-box;line-height:1.45}
    #diag-screen *{box-sizing:border-box}
    #diag-screen h1{font-size:19px;margin:2px 0 6px;color:#fff}
    #diag-screen .sub{font-size:12px;color:#9a9aa8;margin-bottom:10px}
    #diag-screen .blk{display:flex;gap:6px;margin:8px 0 10px}

    #diag-screen td:first-child{color:#9a9aa8;white-space:nowrap;width:88px}
    #diag-screen td.y{color:#4ade80} #diag-screen td.n{color:#f87171}
    #diag-screen .sec{font-size:12.5px;font-weight:700;color:#7dd3fc;margin:12px 0 2px}
    #diag-screen .enter{display:block;width:100%;margin:14px 0 4px;padding:15px 0;font-size:18px;font-weight:800;border:0;border-radius:12px;background:#00aeec;color:#fff;cursor:pointer}
    #diag-screen .note{font-size:11px;color:#8a8a98;text-align:center}
  </style>

<body>
  <script>
    // 页面模式：prod=正式外观（隐藏所有测试/调试控件）/ test=完整测试模式
    // 切换入口：连点左上角 logo 5 次（compat.js 内实现）；URL 带 ?test=1 也可直接进入测试模式
    (function () {
      var m = 'prod'
      try {
        if (location.search.indexOf('test=1') >= 0 || localStorage.getItem('toyTestMode') === '1') m = 'test'
      } catch (_) {}
      document.body.setAttribute('data-mode', m)
    })()
  </script>
  <!-- ── 诊断首屏（平台集成问题专测；点“进入正式页”后隐藏） ── -->
  <div id="diag-screen" aria-label="环境诊断">
    <h1>LumiScore 环境诊断</h1>
    <div class="sub" id="diag-when"></div>
    <div class="verdict ok" id="diag-verdict">基础渲染 OK（本屏为纯内联，若你能看到色块与文字，说明 iframe 与页面已在正常渲染）</div>
    <div class="blk" id="diag-blocks"><i style="background:#e23b3b"></i><i style="background:#2ecc71"></i><i style="background:#2f7df6"></i></div>
    <div class="sec">视口 / 页面大小</div>
    <table id="diag-viewport"></table>
    <div class="sec">安全区</div>
    <table id="diag-safe"></table>
    <div class="sec">CSS 特性（旧内核回退排查）</div>
    <table id="diag-css"></table>
    <div class="sec">容器 / SDK</div>
    <table id="diag-container"></table>
    <div class="sec">资源加载（预加载/阻塞排查）</div>
    <table id="diag-res"></table>
    <div class="sec">脚本执行链</div>
    <table id="diag-js"></table>
    <button class="enter" type="button" id="diag-enter">进入正式页 →</button>
    <div class="note">正式页在本屏背后已加载；点击后隐藏本屏即可看到正式页面。</div>
  </div>
  <script>
    (function () {
      // 纯内联诊断：不依赖任何外部文件
      var scr = document.getElementById('diag-screen')
      var t0 = Date.now()
      document.getElementById('diag-when').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) + ' · 打开后 ' + Math.round((t0 - performance.timeOrigin) / 100) / 10 + 's'
      function row(t, v, cls) {
        var td = document.createElement('td'); if (cls) td.className = cls; td.textContent = v
        var tr = document.createElement('tr'); tr.appendChild(document.createElement('td')).textContent = t; tr.appendChild(td)
        return tr
      }
      function fill(id, rows) {
        var tb = document.getElementById(id)
        for (var i = 0; i < rows.length; i++) tb.appendChild(rows[i])
      }
      function sup(p, v) { try { return CSS.supports(p, v) } catch (e) { return false } }
      // 安全区：占位元素分别读取四个方向 env() 实际值
      var probe = document.createElement('div')
      probe.style.cssText = 'position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)'
      document.body.appendChild(probe)
      var pc = getComputedStyle(probe)
      function pv(name) { var v = parseFloat(pc[name]); return isNaN(v) ? 0 : Math.round(v) }
      var spT = pv('paddingTop'), spR = pv('paddingRight'), spB = pv('paddingBottom'), spL = pv('paddingLeft')
      function pad2(s) { return s.length === 1 ? '0' + s : s }
      function pad4(n) { return String(Math.round(n)).padStart ? String(Math.round(n)).padStart(4, '0') : String(Math.round(n)) }
      function envSafe() {
        // 已知内核实现差异：env() 不支持时返回 0px；部分内核错误按整行 0
        return sp.join('/')
      }
      // 视口
      var vp = [
        row('inner', window.innerWidth + ' x ' + window.innerHeight),
        row('outer', window.outerWidth + ' x ' + window.outerHeight),
        row('screen', (window.screen.width || '-') + ' x ' + (window.screen.height || '-')),
        row('dpr', window.devicePixelRatio || 1),
        row('iframe?', self === top ? '独立页面' : 'iframe 内'),
        row('referrer', document.referrer || '(无)'),
        row('href', location.href.slice(0, 110)),
      ]
      fill('diag-viewport', vp)
      // 安全区
      fill('diag-safe', [
        row('env()', 'T' + spT + ' R' + spR + ' B' + spB + ' L' + spL, (spT + spR + spB + spL) > 0 ? 'y' : 'n'),
        row('CSS env 支持', sup('padding-top', 'env(safe-area-inset-top)') ? '支持' : '不支持', sup('padding-top', 'env(safe-area-inset-top)') ? 'y' : 'n'),
      ])
      // CSS 特性
      var feats = [
        ['color-mix()', sup('color', 'color-mix(in srgb, red, blue)')],
        ['100dvh', sup('height', '100dvh')],
        ['100svh', sup('height', '100svh')],
        ['aspect-ratio 属性', sup('aspect-ratio', '1/1')],
        ['container queries', sup('container-type', 'inline-size')],
        [':has()', (function () { try { return !!document.querySelector('body:has(div)') } catch (e) { return false } })()],
        ['gap (flex)', (function () { var d = document.createElement('div'); d.style.cssText = 'display:flex;gap:8px'; return d.style.gap === '8px' })()],
        ['clamp()', sup('font-size', 'clamp(1px,2px,3px)')],
        ['backdrop-filter', sup('backdrop-filter', 'blur(2px)')],
        ['position:sticky', sup('position', 'sticky')],
      ]
      fill('diag-css', feats.map(function (f) { return row(f[0], f[1] ? '支持' : '不支持', f[1] ? 'y' : 'n') }))
      // 容器 / SDK
      var con = [
        row('UA', navigator.userAgent.slice(0, 110)),
        row('window.toy', typeof window.toy === 'object' ? 'object (' + (Object.keys(window.toy).length || '?') + ' 项)' : String(typeof window.toy), typeof window.toy === 'object' ? 'y' : 'n'),
        row('biliInjectV2', typeof window.biliInjectV2 === 'object' ? 'object' : String(typeof window.biliInjectV2), typeof window.biliInjectV2 === 'object' ? 'y' : 'n'),
        row('navigator.share', !!navigator.share, !!navigator.share ? 'y' : 'n'),
        row('MediaRecorder', typeof MediaRecorder !== 'undefined', typeof MediaRecorder !== 'undefined' ? 'y' : 'n'),
        row('canvas.captureStream', (function () { var c = document.createElement('canvas'); return !!(c.captureStream) })(), (function () { var c = document.createElement('canvas'); return !!(c.captureStream) })() ? 'y' : 'n'),
        row('WebGL', (function () { try { var c = document.createElement('canvas'); var gl = c.getContext('webgl2') || c.getContext('webgl'); return gl ? (gl instanceof WebGL2RenderingContext ? '2.0' : '1.0') : '无' } catch (e) { return '错误' } })()),
      ]
      fill('diag-container', con)
      // 资源加载：load 后汇总 performance entries + script/link 状态
      var resRows = []
      function collectRes() {
        var wants = [
          { key: '/sdk/toy-sdk.js', label: '官方 SDK' },
          { key: '/compat.js', label: 'compat.js' },
          { key: '/toy-sdk.js', label: 'toy-sdk.js' },
          { key: '/export-test.js', label: 'export-test.js' },
          { key: '/test.js', label: 'test.js' },
          { key: '/shell.css', label: 'shell.css' },
          { key: '/test.css', label: 'test.css' },
          { key: '/lumiscore-logo.svg', label: 'logo' },
        ]
        var entries = {}
        try {
          var perfs = performance.getEntriesByType('resource')
          for (var i = 0; i < perfs.length; i++) entries[perfs[i].name] = perfs[i]
        } catch (e) {}
        var scripts = document.querySelectorAll('script[src]')
        var links = document.querySelectorAll('link[rel=stylesheet]')
        for (var w = 0; w < wants.length; w++) {
          var key = wants[w].key
          var found = false
          var dur = ''
          for (var name in entries) {
            if (name.indexOf(key) >= 0) {
              found = true
              dur = Math.round(entries[name].duration) + 'ms'
              break
            }
          }
          if (found) {
            resRows.push(row(wants[w].label, '已加载 ' + dur, 'y'))
          } else {
            var inDom = false
            for (var s = 0; s < scripts.length; s++) if (scripts[s].src.indexOf(key) >= 0) inDom = true
            for (var l = 0; l < links.length; l++) if (links[l].href.indexOf(key) >= 0) inDom = true
            resRows.push(row(wants[w].label, inDom ? '引用但无加载记录（失败/被拦截/未完成）' : '未引用', 'n'))
          }
        }
        fill('diag-res', resRows)
      }
      // 脚本执行链（load 后重新填充，确保外部脚本已跑完）
      function fillJs() {
        var tb = document.getElementById('diag-js')
        tb.innerHTML = ''
        var jsRows = [
          row('data-mode', document.body.dataset.mode || '(无)'),
          row('compat.js 执行', window.__compatBoot ? '是' : '未执行/失败', window.__compatBoot ? 'y' : 'n'),
          row('toy-sdk.js 执行', window.__toyLocalBoot ? '是' : '未执行/失败', window.__toyLocalBoot ? 'y' : 'n'),
          row('test.js 执行 (setPage)', typeof window.setPage === 'function' ? '是' : '未执行/失败', typeof window.setPage === 'function' ? 'y' : 'n'),
          row('export-test.js 执行', window.__exportBoot ? '是' : '未执行/失败', window.__exportBoot ? 'y' : 'n'),
          row('document.readyState', document.readyState),
          row('load 事件', (function () {
            try {
              var t = performance.timing
              if (t && t.loadEventEnd > 0) return '已触发(约' + Math.round(t.loadEventEnd - t.navigationStart) + 'ms)'
              return '进行中/未触发'
            } catch (e) { return '未知' }
          })()),
        ]
        fill('diag-js', jsRows)
      }
      fillJs()
      // 等 load 后再收集资源状态（避免过早）
      var done = false
      function finish() {
        if (done) return
        done = true
        collectRes()
        fillJs()
        var blk = document.getElementById('diag-blocks')
        // 关键判定：基础渲染 OK 已经显示；补充资源结论
        var failed = resRows.filter(function (r) { return r.textContent.indexOf('失败') >= 0 || r.textContent.indexOf('未引用') >= 0 })
        if (failed.length) {
          var v = document.getElementById('diag-verdict')
          v.className = 'verdict bad'
          v.textContent = '发现 ' + failed.length + ' 项资源未加载（见“资源加载”表）——若色块正常而正式页缺东西，多半与这些资源有关'
        }
      }
      if (document.readyState === 'complete') finish()
      else window.addEventListener('load', finish)
      // 进入正式页
      document.getElementById('diag-enter').addEventListener('click', function () {
        scr.style.display = 'none'
      })
      // 兜底：10s 后资源仍未收集就强制收集
      setTimeout(finish, 10000)
    })()
  </script>

          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3v5l3 3v2h-6v6l-1 2-1-2v-6H5v-2l3-3V3h8m0-2H8c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 .28-.11.53-.29.71L6.3 12.1c-.19.19-.3.44-.3.7V14c0 .55.45 1 1 1h5v5.5c0 .32.18.62.46.77L12 22l.54-.73c.28-.15.46-.45.46-.77V15h5c.55 0 1-.45 1-1v-1.2c0-.26-.11-.51-.29-.71l-2.41-2.39A1 1 0 0 1 15 9V3h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
        </button>
        <button class="sh-pb__icon" type="button" aria-label="后退 10 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.6L5.2 9l5.8 4.4v-3A5.6 5.6 0 1 1 5.4 16H3.4a7.6 7.6 0 1 0 7.6-9z" fill="currentColor" stroke="none"/><path d="M5.2 4.6v3.4" /></svg>
        </button>
        <button class="sh-pb__icon sh-pb__play" type="button" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="sh-pb__icon" type="button" aria-label="前进 10 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.6L18.8 9 13 13.4V10a5.6 5.6 0 1 0 5.6 6h2A7.6 7.6 0 1 1 13 7z" fill="currentColor" stroke="none"/><path d="M18.8 4.6V8" /></svg>
        </button>
        <span class="sh-pb__time" id="pb-time">0:00</span>
        <input type="range" class="sh-pb__seek" min="0" max="1000" value="0" aria-label="进度" />
        <div class="sh-pb__break"></div>
        <button class="sh-pb__icon sh-pb__vol" type="button" aria-label="音量" id="pb-vol"></button>
        <input type="range" class="sh-pb__mini-range" min="0" max="100" step="1" value="80" aria-label="音量滑杆" />
        <button class="sh-pb__speed" type="button" id="pb-speed">1×</button>
        <button class="sh-pb__panel-btn" type="button" id="pb-panel-btn" hidden>路径</button>
        <span class="sh-pb__zoom-icon" aria-hidden="true" id="pb-zoom-icon"></span>
        <input type="range" class="sh-pb__mini-range sh-pb__zoom" min="0" max="100" step="1" value="100" aria-label="缩放" />
        <button class="sh-pb__icon sh-pb__close" type="button" aria-label="收起">×</button>
      </div>
    </div>
  </div>

  <!-- ── 超宽屏（>2:1）行首折叠开关：标题行、播放控件行各一个 ── -->
  <button class="corner-collapse" type="button" id="collapse-title" hidden aria-label="折叠标题">‹</button>
  <button class="corner-collapse" type="button" id="collapse-player" hidden aria-label="折叠播放控件">‹</button>

  <!-- 路径 / 场景面板：底栏与页面之间（竖屏）或侧栏左侧（超宽屏）弹出 -->
  <div class="sh-pb-panel" id="pb-panel" hidden>
    <div class="sh-pb-panel__head">
      <span class="sh-pb-panel__title" id="pb-panel-title"></span>
      <button class="pb-panel__pin" type="button" id="pb-panel-pin" aria-label="钉住面板" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3v5l3 3v2h-6v6l-1 2-1-2v-6H5v-2l3-3V3h8m0-2H8c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 .28-.11.53-.29.71L6.3 12.1c-.19.19-.3.44-.3.7V14c0 .55.45 1 1 1h5v5.5c0 .32.18.62.46.77L12 22l.54-.73c.28-.15.46-.45.46-.77V15h5c.55 0 1-.45 1-1v-1.2c0-.26-.11-.51-.29-.71l-2.41-2.39A1 1 0 0 1 15 9V3h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </button>
    </div>
    <div class="sh-pb-panel__body" id="pb-panel-body"></div>
  </div>

  <script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
  <script src="compat.js"></script>
  <script src="toy-sdk.js"></script>
  <script src="export-test.js"></script>
  <script src="test.js"></script>
</body>
</html>
