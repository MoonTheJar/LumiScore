<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>星跃谱 LumiScore · 3D 可视化乐谱</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0b0d13" />
  <link rel="icon" type="image/svg+xml" href="icons/lumiscore-favicon.svg" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      background: #0b0d13;
    }
    /* hash 路由外壳：整页由 iframe 承载五个步骤页；外壳只负责 URL(#/步骤) 与导航 */
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #0b0d13;
    }
    #boot {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      color: #e6e9f0;
      font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: 0.08em;
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #boot.is-hidden { opacity: 0; }
  </style>
  <script type="module" src="../src/router/main.ts"></script>
</head>

<body>
  <iframe id="stage" title="星跃谱" allow="autoplay; clipboard-read; clipboard-write; fullscreen; midi; microphone; encrypted-media"></iframe>
  <div id="boot">星跃谱 LumiScore · 正在载入…</div>
</body>

</html>
