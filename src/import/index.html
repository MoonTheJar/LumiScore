<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>星跃谱 LumiScore · 导入乐谱</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="../../icons/lumiscore-favicon.svg" />
  <link rel="stylesheet" href="../../shell-theme.css" />
  <!-- 首屏这几件事必须内联（外链脚本和模块都要等整张依赖图下载求值完才执行）：
       ① 主题/动效偏好：原来要等 JS 才写 data-theme，暗色用户必然先白闪一下再转暗；
       ② data-boot='1'：让 public/shell-theme.css 里的令牌副本先顶着首帧，
          外壳挂上后由 shell.ts 摘掉标记，副本自动退出层叠，不存在谁覆盖谁；
       ③ 看门狗兜底：模块图过大、某个资源 404、任何一处抛错时，页面不能永远停在
          「data-i18n 节点全是空、按钮没字」的骨架上，至少给一句人话和一个重试按钮；
       ④ 装配看门狗：外壳挂上 ≠ 本页脚本跑完。模块顶层半途抛错时后半段根本不执行，
          症状是「页面看着正常、下拉和面板全没了」，所以模块要走完顶层并调
          __lumiReady()，没调到就把这条中断显式挂在页面上（各页 main.ts 末尾）。 -->
  <script>
    (function () {
      var root = document.documentElement
      root.dataset.boot = '1'
      try {
        var tm = localStorage.getItem('midee.theme') || 'system'
        root.dataset.theme =
          tm === 'dark' || (tm === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
        root.dataset.motion = localStorage.getItem('midee.motion') === 'reduced' ? 'reduced' : 'full'
      } catch (e) {
        /* 隐私模式读不到 localStorage：按默认亮色 */
      }
      // 看门狗跑在模块图之前，没法 import i18n：就地按持久化语言挑一份极简词表
      var zh = false
      try {
        var savedLocale = localStorage.getItem('midee.locale')
        zh = savedLocale
          ? savedLocale.indexOf('zh') === 0
          : (navigator.language || '').indexOf('zh') === 0
      } catch (e) {
        /* 沿用中文 */
      }
      var L = zh
        ? { head: '界面没能加载完成', sep: '：', tail: '，可能是网络或资源加载被打断。', retry: '重新加载', ignore: '暂不处理', asm: '本页控件没能全部装上：页面脚本被一条错误中断，下拉和面板点了可能没反应。原因见下面那行，浏览器控制台（F12）里有完整堆栈。', res: '资源或脚本加载失败', async: '异步任务失败', timeout: '超时未就绪', title: '星跃谱 LumiScore · 导入乐谱' }
        : { head: 'The interface failed to load', sep: ': ', tail: '. The network or a resource may have been interrupted.', retry: 'Reload', ignore: 'Dismiss', asm: 'Some controls on this page never got built: the page script was interrupted by an error, so dropdowns and panels may do nothing. The line below names the cause; the browser console (F12) has the full trace.', res: 'A resource or script failed to load', async: 'An async task failed', timeout: 'Timed out before it was ready', title: 'LumiScore · Import' }
      document.title = L.title
      var timer = 0
      var box = null
      // 装配看门狗：「外壳挂上了」不等于「本页脚本跑完了」。模块后半段一抛错就悄无声息
      // 地不执行，症状是页面看着正常、下拉和面板全没了——只有本页自己知道装配是否结束，
      // 所以约定模块顶层走完要调 __lumiReady()。没调到 = 初始化被中断。
      var asm = { ready: false, err: '', hushed: false }
      window.__lumiAsm = asm
      // e.target 是元素 → 资源 404（无关紧要）；是 window → 脚本运行时错误（真凶）
      function isScriptErr(e) {
        return !!(e && e.message && (!e.target || e.target === window))
      }
      function show(reason) {
        if (box || root.dataset.topbar === 'expanded') return
        box = document.createElement('div')
        box.className = 'lumi-bootfail'
        box.setAttribute('role', 'alert')
        box.textContent = L.head + (reason ? L.sep + reason : '') + L.tail
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = L.retry
        btn.addEventListener('click', function () {
          location.reload()
        })
        box.appendChild(btn)
        document.body.appendChild(box)
      }
      // 装配中断专用：不看 topbar，把错误原文摊开，给「重新加载」和「暂不处理」两个出口
      function showAsm() {
        if (asm.ready || asm.hushed || box) return
        box = document.createElement('div')
        box.className = 'lumi-bootfail lumi-bootfail--asm'
        box.setAttribute('role', 'alert')
        var p = document.createElement('div')
        p.textContent = L.asm
        box.appendChild(p)
        if (asm.err) {
          var d = document.createElement('div')
          d.className = 'lumi-bootfail__err'
          d.textContent = asm.err
          box.appendChild(d)
        }
        var r = document.createElement('button')
        r.type = 'button'
        r.textContent = L.retry
        r.addEventListener('click', function () {
          location.reload()
        })
        var x = document.createElement('button')
        x.type = 'button'
        x.className = 'lumi-bootfail__x'
        x.textContent = L.ignore
        x.addEventListener('click', function () {
          // 记下「暂不处理」：15s 那条兜底定时器不能再把横幅弹回来
          asm.hushed = true
          box.remove()
          box = null
        })
        box.append(r, x)
        document.body.appendChild(box)
      }
      // 报错先宽限 1.5s：无关资源 404 不该抢先把人吓一跳，外壳正常挂上就一笔勾销；
      // 装配未完成时的脚本错误就是真凶，不等。
      function suspect(reason, fatal) {
        if (timer || box) return
        timer = setTimeout(
          function () {
            timer = 0
            if (fatal) showAsm()
            else show(reason)
          },
          fatal ? 300 : 1500
        )
      }
      // capture=true 才收得到 link/script 这类资源加载失败
      addEventListener('error', function (e) {
        var msg = e && e.message ? String(e.message).slice(0, 140) : ''
        var fatal = isScriptErr(e) && !asm.ready
        if (fatal && !asm.err) asm.err = msg
        suspect(msg || L.res, fatal)
      }, true)
      addEventListener('unhandledrejection', function () {
        suspect(L.async)
      })
      setTimeout(function () {
        show(L.timeout)
      }, 10000)
      // 初始化卡住不报错（await 永不返回）也算装配失败，只是没有错误原文。
      // 留 15s：dev 冷启动整张模块图可能就要十几秒，别抢跑。
      setTimeout(function () {
        showAsm()
      }, 15000)
      window.__lumiBooted = function () {
        delete root.dataset.boot
        if (timer) {
          clearTimeout(timer)
          timer = 0
        }
        // 装配中断的横幅不归外壳管：它说的是本页脚本没跑完，topbar 起来不代表控件装上了
        if (box && !box.classList.contains('lumi-bootfail--asm')) {
          box.remove()
          box = null
        }
      }
      // 由模块在顶层求值全部走完后调用（见各页 main.ts 末尾）
      window.__lumiReady = function () {
        asm.ready = true
        if (box && box.classList.contains('lumi-bootfail--asm')) {
          box.remove()
          box = null
        }
      }
    })()
  </script>
  <style>
    html, body { min-height: 100%; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }

    /* ── 装饰性背景：两团柔光 + 细网格 + 漂浮音符 ── */
    .p1-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .p1-bg::before,
    .p1-bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
    }
    .p1-bg::before {
      width: 520px;
      height: 520px;
      top: -180px;
      left: -120px;
      /* 跟随当前强调色 + 深浅主题（--sh-accent 随主题切换） */
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--sh-accent) 55%, transparent),
        transparent 70%
      );
    }
    .p1-bg::after {
      width: 460px;
      height: 460px;
      right: -140px;
      bottom: -180px;
      /* 强调色与紫色调和，换主题时光斑色相随之改变 */
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--sh-accent) 48%, #a78bfa),
        transparent 70%
      );
      opacity: 0.4;
    }
    .p1-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
          to right,
          color-mix(in srgb, var(--sh-text) 6%, transparent) 1px,
          transparent 1px
        ),
        linear-gradient(to bottom, color-mix(in srgb, var(--sh-text) 6%, transparent) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 72%);
    }
    .p1-float {
      position: absolute;
      color: var(--sh-text);
      opacity: 0.09;
      font-weight: 700;
      animation: p1-drift 15s ease-in-out infinite;
      user-select: none;
    }
    .p1-float:nth-of-type(1) { left: 7%; top: 20%; font-size: 40px; animation-duration: 17s; }
    .p1-float:nth-of-type(2) { left: 13%; top: 64%; font-size: 26px; animation-duration: 13s; animation-delay: -3s; }
    .p1-float:nth-of-type(3) { left: 86%; top: 18%; font-size: 52px; animation-duration: 19s; animation-delay: -6s; opacity: 0.07; }
    .p1-float:nth-of-type(4) { left: 90%; top: 58%; font-size: 30px; animation-duration: 14s; animation-delay: -1s; }
    .p1-float:nth-of-type(5) { left: 78%; top: 82%; font-size: 22px; animation-duration: 16s; animation-delay: -8s; }
    .p1-float:nth-of-type(6) { left: 3%; top: 86%; font-size: 34px; animation-duration: 20s; animation-delay: -4s; opacity: 0.06; }
    .p1-float:nth-of-type(7) { left: 46%; top: 8%; font-size: 20px; animation-duration: 12s; animation-delay: -7s; opacity: 0.08; }
    @keyframes p1-drift {
      0%, 100% { transform: translateY(0) rotate(-7deg); }
      50% { transform: translateY(-26px) rotate(9deg); }
    }
    :root[data-motion='reduced'] .p1-float { animation: none; }
    @media (prefers-reduced-motion: reduce) { .p1-float { animation: none; } }

    .p1-page {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: calc(var(--sh-topbar-h) + 44px) 20px 64px;
    }

    /* ── 大标题区 ── */
    .p1-hero { text-align: center; }
    .p1-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid var(--sh-border);
      background: color-mix(in srgb, var(--sh-surface) 80%, transparent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sh-faint);
    }
    .p1-kicker img { width: 15px; height: 15px; display: block; }
    .p1-title {
      margin: 15px 0 9px;
      font-size: clamp(38px, 6.4vw, 66px);
      line-height: 1.05;
      font-weight: 760;
      letter-spacing: -0.025em;
      color: var(--sh-text);
    }
    .p1-title em {
      font-style: italic;
      font-weight: 500;
      font-family: Georgia, 'Times New Roman', 'Songti SC', serif;
      color: var(--sh-accent);
    }
    .p1-tagline {
      margin: 0;
      font-size: 15px;
      color: var(--sh-muted);
      letter-spacing: 0.01em;
    }
    /* 月谱工坊先导体验：常显小字 */
    .p1-pilot {
      margin: 9px 0 0;
      font-size: 11.5px;
      letter-spacing: 0.05em;
      color: var(--sh-faint);
    }

    /* 小球沿线跳跃装饰：一条渐隐横线 + 三个错拍跳动的小球 */
    .p1-bounce {
      position: relative;
      width: min(360px, 78%);
      height: 46px;
      margin: 26px auto 0;
      /* 小球 translateX 会跑到 105%，不裁剪会撑出横向滚动条 */
      overflow: hidden;
    }
    .p1-bounce__line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      height: 2px;
      border-radius: 2px;
      background: var(--sh-border-strong);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    }
    .p1-bounce__ball {
      position: absolute;
      left: 0;
      bottom: 2px;
      width: 100%;
      height: 12px;
      pointer-events: none;
      animation: p1-run 6s linear infinite;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%);
    }
    .p1-bounce__ball i {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sh-accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--sh-accent) 65%, transparent);
      animation: p1-hop 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
    }
    .p1-bounce__ball:nth-of-type(2) { animation-duration: 7.6s; animation-delay: -2.6s; }
    .p1-bounce__ball:nth-of-type(2) i {
      width: 9px; height: 9px;
      opacity: 0.7;
      animation-duration: 0.88s;
      animation-delay: -0.4s;
    }
    .p1-bounce__ball:nth-of-type(3) { animation-duration: 9.2s; animation-delay: -5.1s; }
    .p1-bounce__ball:nth-of-type(3) i {
      width: 10px; height: 10px;
      opacity: 0.85;
      animation-duration: 1.32s;
      animation-delay: -0.8s;
    }
    @keyframes p1-run {
      from { transform: translateX(-5%); }
      to { transform: translateX(105%); }
    }
    @keyframes p1-hop {
      from { transform: translateY(0) scale(1, 1); }
      12% { transform: translateY(0) scale(1.25, 0.7); }
      to { transform: translateY(-30px) scale(1, 1); }
    }
    :root[data-motion='reduced'] .p1-bounce__ball,
    :root[data-motion='reduced'] .p1-bounce__ball i { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .p1-bounce__ball, .p1-bounce__ball i { animation: none; }
    }

    /* ── 拖入区 ── */
    .p1-drop {
      margin-top: 30px;
      padding: 42px 20px;
      border: 2px dashed var(--sh-border-strong);
      border-radius: var(--sh-r-lg);
      background: color-mix(in srgb, var(--sh-surface) 62%, transparent);
      text-align: center;
      cursor: pointer;
      transition: border-color var(--sh-dur) var(--sh-ease), background var(--sh-dur) var(--sh-ease),
        transform var(--sh-dur) var(--sh-ease), box-shadow var(--sh-dur) var(--sh-ease);
    }
    .p1-drop:hover {
      border-color: var(--sh-accent);
      box-shadow: 0 0 0 4px var(--sh-accent-soft);
    }
    .p1-drop:focus-visible {
      outline: none;
      border-color: var(--sh-accent);
      box-shadow: 0 0 0 4px var(--sh-accent-soft);
    }
    .p1-drop.is-over {
      border-color: var(--sh-accent);
      background: var(--sh-accent-soft);
      transform: scale(1.01);
    }
    .p1-drop__icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: var(--sh-accent);
      background: var(--sh-surface);
      border: 1px solid var(--sh-border);
      box-shadow: var(--sh-shadow-1);
      transition: transform var(--sh-dur) var(--sh-ease);
    }
    .p1-drop:hover .p1-drop__icon,
    .p1-drop.is-over .p1-drop__icon { transform: translateY(-3px); }
    .p1-drop__main { font-size: 16px; font-weight: 650; color: var(--sh-text); }

    .p1-under {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .p1-sub {
      flex: 1 1 280px;
      margin: 0;
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--sh-faint);
    }
    .p1-under .sh-btn { flex: none; }
    .p1-status { margin-top: 12px; text-align: center; }

    /* ── 示例卡片（三个，内容预留） ── */
    .p1-samples { margin-top: 34px; }
    .p1-samples__label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sh-faint);
    }
    .p1-samples__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .p1-sample {
      height: 118px;
      display: grid;
      place-items: center;
      gap: 8px;
      align-content: center;
      border-radius: var(--sh-r);
      border: 1.5px dashed var(--sh-border-strong);
      background: color-mix(in srgb, var(--sh-surface) 55%, transparent);
      cursor: pointer;
      padding: 10px;
      transition: border-color var(--sh-dur) var(--sh-ease), background var(--sh-dur) var(--sh-ease),
        transform var(--sh-dur) var(--sh-ease);
    }
    .p1-sample:hover {
      border-color: var(--sh-accent);
      border-style: solid;
      background: var(--sh-surface-2);
      transform: translateY(-2px);
    }
    .p1-sample:focus-visible {
      outline: none;
      border-color: var(--sh-accent);
      box-shadow: 0 0 0 3px var(--sh-accent-soft);
    }
    .p1-sample__glyph {
      font-size: 26px;
      color: var(--sh-faint);
      opacity: 0.5;
      line-height: 1;
      transition: color var(--sh-dur) var(--sh-ease), opacity var(--sh-dur) var(--sh-ease);
    }
    .p1-sample:hover .p1-sample__glyph { color: var(--sh-accent); opacity: 0.9; }
    .p1-sample__title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sh-text);
      line-height: 1.4;
    }

    /* ── 支持格式 ── */
    .p1-formats { margin-top: 30px; }
    .p1-formats__t {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sh-faint);
    }
    .p1-formats .sh-chips { margin-top: 9px; }
    .p1-note { margin: 16px 0 0; font-size: 12.5px; line-height: 1.75; color: var(--sh-muted); }
    .p1-credit {
      margin-top: 20px;
      padding-top: 13px;
      border-top: 1px solid var(--sh-border);
      font-size: 11.5px;
      color: var(--sh-faint);
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 520px) {
      .p1-samples__grid { grid-template-columns: 1fr; }
      .p1-sample { height: 84px; }
      .p1-float:nth-of-type(n+5) { display: none; }
    }
  </style>
</head>
<body>
  <div class="p1-bg" aria-hidden="true">
    <div class="p1-grid"></div>
    <span class="p1-float">♪</span>
    <span class="p1-float">♩</span>
    <span class="p1-float">♫</span>
    <span class="p1-float">♬</span>
    <span class="p1-float">♭</span>
    <span class="p1-float">♪</span>
    <span class="p1-float">♩</span>
  </div>

  <main class="p1-page">
    <!-- 大标题 -->
    <section class="p1-hero">
      <span class="p1-kicker"><span data-i18n="p1.kicker"></span></span>
      <h1 class="p1-title" data-i18n-html="p1.title.html">3D <em>音乐小球</em> 生成器</h1>
      <p class="p1-tagline" data-i18n="p1.tagline"></p>
      <p class="p1-pilot" data-i18n="p1.pilot"></p>
      <div class="p1-bounce" aria-hidden="true">
        <i class="p1-bounce__line"></i>
        <span class="p1-bounce__ball"><i></i></span>
        <span class="p1-bounce__ball"><i></i></span>
        <span class="p1-bounce__ball"><i></i></span>
      </div>
    </section>

    <!-- 拖入区 -->
    <div class="p1-drop" id="drop" role="button" tabindex="0">
      <div class="p1-drop__icon">↓</div>
      <div class="p1-drop__main" data-i18n="p1.drop.main"></div>
    </div>

    <!-- 拖入说明 + 选择按钮 -->
    <div class="p1-under">
      <p class="p1-sub" data-i18n="p1.sub"></p>
      <button class="sh-btn sh-btn--primary" id="pickBtn" type="button" data-i18n="p1.pick"></button>
    </div>
    <div class="sh-status p1-status" id="status" role="status" data-i18n="p1.status.idle" hidden></div>

    <!-- 示例乐谱（三个卡片，内容预留） -->
    <section class="p1-samples">
      <div class="p1-samples__label" data-i18n="p1.samples"></div>
      <div class="p1-samples__grid">
        <button class="p1-sample" type="button" data-sample="bach-prelude-c.md"><span class="p1-sample__glyph" aria-hidden="true">♪</span><span class="p1-sample__title" data-i18n="p1.sample.bachPreludeC.name"></span></button>
        <button class="p1-sample" type="button" data-sample="bach-minuet-g.md"><span class="p1-sample__glyph" aria-hidden="true">♫</span><span class="p1-sample__title" data-i18n="p1.sample.bachMinuetG.name"></span></button>
        <button class="p1-sample" type="button" data-sample="chopin-prelude-e-minor.md"><span class="p1-sample__glyph" aria-hidden="true">♩</span><span class="p1-sample__title" data-i18n="p1.sample.chopinPreludeEm.name"></span></button>
      </div>
    </section>

    <!-- 支持格式 -->
    <section class="p1-formats">
      <div class="p1-formats__t" data-i18n="p1.formats"></div>
      <div class="sh-chips">
        <span class="sh-chip">.mid .midi .kar</span>
        <span class="sh-chip">.xml .musicxml</span>
        <span class="sh-chip">.mxl</span>
        <span class="sh-chip">.mscz .mscx</span>
        <span class="sh-chip">.gp .gp3 .gp4 .gp5 .gpx .gtp .ptb</span>
      </div>
    </section>

    <p class="p1-note" data-i18n="p1.note"></p>
    <div class="p1-credit" data-i18n="p1.credit"></div>

    <input
      type="file"
      id="file"
      hidden
      accept=".zip,.mid,.midi,.kar,.xml,.musicxml,.mxl,.mscz,.mscx,.gp,.gp3,.gp4,.gp5,.gpx,.gtp,.ptb"
    />
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
