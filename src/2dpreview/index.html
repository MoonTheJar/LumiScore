<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>星跃谱 LumiScore · 2D 乐谱检查</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="../../icons/lumiscore-favicon.svg" />
  <link rel="stylesheet" href="../../shell-theme.css" />
  <!-- 首屏这几件事必须内联（外链脚本和模块都要等整张依赖图下载求值完才执行）：
       ① 主题/动效偏好：原来要等 JS 才写 data-theme，暗色用户必然先白闪一下再转暗；
       ② data-boot='1'：让 public/shell-theme.css 里的令牌副本先顶着首帧，
          外壳挂上后由 shell.ts 摘掉标记，副本自动退出层叠，不存在谁覆盖谁；
       ③ 看门狗兜底：模块图过大、某个资源 404、任何一处抛错时，页面不能永远停在
          「data-i18n 节点全是空、按钮没字」的骨架上，至少给一句人话和一个重试按钮；
       ④ 装配看门狗：外壳挂上 ≠ 本页脚本跑完。模块顶层半途抛错时后半段根本不执行，
          症状是「页面看着正常、下拉和面板全没了」，所以模块要走完顶层并调
          __lumiReady()，没调到就把这条中断显式挂在页面上（各页 main.ts 末尾）。 -->
  <script>
    (function () {
      var root = document.documentElement
      root.dataset.boot = '1'
      try {
        var tm = localStorage.getItem('midee.theme') || 'system'
        root.dataset.theme =
          tm === 'dark' || (tm === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
        root.dataset.motion = localStorage.getItem('midee.motion') === 'reduced' ? 'reduced' : 'full'
      } catch (e) {
        /* 隐私模式读不到 localStorage：按默认亮色 */
      }
      // 看门狗跑在模块图之前，没法 import i18n：就地按持久化语言挑一份极简词表
      var zh = false
      try {
        var savedLocale = localStorage.getItem('midee.locale')
        zh = savedLocale
          ? savedLocale.indexOf('zh') === 0
          : (navigator.language || '').indexOf('zh') === 0
      } catch (e) {
        /* 沿用中文 */
      }
      var L = zh
        ? { head: '界面没能加载完成', sep: '：', tail: '，可能是网络或资源加载被打断。', retry: '重新加载', ignore: '暂不处理', asm: '本页控件没能全部装上：页面脚本被一条错误中断，下拉和面板点了可能没反应。原因见下面那行，浏览器控制台（F12）里有完整堆栈。', res: '资源或脚本加载失败', async: '异步任务失败', timeout: '超时未就绪', title: '星跃谱 LumiScore · 2D 乐谱检查' }
        : { head: 'The interface failed to load', sep: ': ', tail: '. The network or a resource may have been interrupted.', retry: 'Reload', ignore: 'Dismiss', asm: 'Some controls on this page never got built: the page script was interrupted by an error, so dropdowns and panels may do nothing. The line below names the cause; the browser console (F12) has the full trace.', res: 'A resource or script failed to load', async: 'An async task failed', timeout: 'Timed out before it was ready', title: 'LumiScore · 2D Check' }
      document.title = L.title
      var timer = 0
      var box = null
      // 装配看门狗：「外壳挂上了」不等于「本页脚本跑完了」。模块后半段一抛错就悄无声息
      // 地不执行，症状是页面看着正常、下拉和面板全没了——只有本页自己知道装配是否结束，
      // 所以约定模块顶层走完要调 __lumiReady()。没调到 = 初始化被中断。
      var asm = { ready: false, err: '', hushed: false }
      window.__lumiAsm = asm
      // e.target 是元素 → 资源 404（无关紧要）；是 window → 脚本运行时错误（真凶）
      function isScriptErr(e) {
        return !!(e && e.message && (!e.target || e.target === window))
      }
      function show(reason) {
        if (box || root.dataset.topbar === 'expanded') return
        box = document.createElement('div')
        box.className = 'lumi-bootfail'
        box.setAttribute('role', 'alert')
        box.textContent = L.head + (reason ? L.sep + reason : '') + L.tail
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = L.retry
        btn.addEventListener('click', function () {
          location.reload()
        })
        box.appendChild(btn)
        document.body.appendChild(box)
      }
      // 装配中断专用：不看 topbar，把错误原文摊开，给「重新加载」和「暂不处理」两个出口
      function showAsm() {
        if (asm.ready || asm.hushed || box) return
        box = document.createElement('div')
        box.className = 'lumi-bootfail lumi-bootfail--asm'
        box.setAttribute('role', 'alert')
        var p = document.createElement('div')
        p.textContent = L.asm
        box.appendChild(p)
        if (asm.err) {
          var d = document.createElement('div')
          d.className = 'lumi-bootfail__err'
          d.textContent = asm.err
          box.appendChild(d)
        }
        var r = document.createElement('button')
        r.type = 'button'
        r.textContent = L.retry
        r.addEventListener('click', function () {
          location.reload()
        })
        var x = document.createElement('button')
        x.type = 'button'
        x.className = 'lumi-bootfail__x'
        x.textContent = L.ignore
        x.addEventListener('click', function () {
          // 记下「暂不处理」：15s 那条兜底定时器不能再把横幅弹回来
          asm.hushed = true
          box.remove()
          box = null
        })
        box.append(r, x)
        document.body.appendChild(box)
      }
      // 报错先宽限 1.5s：无关资源 404 不该抢先把人吓一跳，外壳正常挂上就一笔勾销；
      // 装配未完成时的脚本错误就是真凶，不等。
      function suspect(reason, fatal) {
        if (timer || box) return
        timer = setTimeout(
          function () {
            timer = 0
            if (fatal) showAsm()
            else show(reason)
          },
          fatal ? 300 : 1500
        )
      }
      // capture=true 才收得到 link/script 这类资源加载失败
      addEventListener('error', function (e) {
        var msg = e && e.message ? String(e.message).slice(0, 140) : ''
        var fatal = isScriptErr(e) && !asm.ready
        if (fatal && !asm.err) asm.err = msg
        suspect(msg || L.res, fatal)
      }, true)
      addEventListener('unhandledrejection', function () {
        suspect(L.async)
      })
      setTimeout(function () {
        show(L.timeout)
      }, 10000)
      // 初始化卡住不报错（await 永不返回）也算装配失败，只是没有错误原文。
      // 留 15s：dev 冷启动整张模块图可能就要十几秒，别抢跑。
      setTimeout(function () {
        showAsm()
      }, 15000)
      window.__lumiBooted = function () {
        delete root.dataset.boot
        if (timer) {
          clearTimeout(timer)
          timer = 0
        }
        // 装配中断的横幅不归外壳管：它说的是本页脚本没跑完，topbar 起来不代表控件装上了
        if (box && !box.classList.contains('lumi-bootfail--asm')) {
          box.remove()
          box = null
        }
      }
      // 由模块在顶层求值全部走完后调用（见各页 main.ts 末尾）
      window.__lumiReady = function () {
        asm.ready = true
        if (box && box.classList.contains('lumi-bootfail--asm')) {
          box.remove()
          box = null
        }
      }
    })()
  </script>
  <link rel="preconnect" href="https://fonts.zeoseven.com" />
  <!-- 思源黑体外链只是「可用时字更好看」的增强，本地 NotoSC 子集已经兜底。
       原来写成 CSS 里的 @import：那是渲染阻塞的跨域请求，CDN 慢或被挡时整页
       白屏等到超时（生产构建还会把它剥掉，dev 与线上表现不一致）。改成非阻塞。 -->
  <link rel="stylesheet" href="https://fonts.zeoseven.com/fonts/69/main.css" media="print" onload="this.media='all'" />
  <!-- 谱面字体提前 preload：等样式生效再排队会白慢一拍（首屏字体回退闪一下就是它） -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="../../fonts/Bravura.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="../../fonts/Liberation.woff2" />
  <style>
    @font-face {
      font-family: 'Bravura';
      src: url('../../fonts/Bravura.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Liberation';
      src: url('../../fonts/Liberation.woff2') format('woff2');
      /* 歌词/文字用：先出系统字体再换，别为了等字体空着一段文字 */
      font-display: swap;
    }
    /* 中文兜底：本地 7000 字子集（NotoSC）+ ZSFT 思源黑体外链（可用时优先高质量渲染，见 head 里的非阻塞 link） */
    @font-face {
      font-family: 'NotoSC';
      src: url('../../fonts/noto-7000.woff2') format('woff2');
      font-display: swap;
    }

    /* 乐谱区：无限画布，固定白底（不跟随深色模式）；黑底白谱由 body.dark2d 切换 */
    #score {
      position: fixed;
      inset: var(--sh-topbar-h) calc(var(--sh-side-inset) + var(--sh-dock-right, 0px)) 30px var(--sh-dock-left, 0px);
      overflow: auto;
      background: #fff;
      transition: top var(--sh-dur) var(--sh-ease);
    }
    body.dark2d #score {
      background: #14161a;
    }
    body.dark2d #scoreInner svg :is(path, rect, circle, ellipse, line, polyline, polygon, text, use) {
      fill: #f0f2f5 !important;
      stroke: #f0f2f5 !important;
    }
    :root[data-topbar='collapsed'] #score {
      top: 0;
    }

    #scoreInner {
      position: relative;
      display: inline-block;
      min-width: 100%;
    }
    /* 无限画布：svg 不裁剪 viewBox 外内容，自由文字元素可拖到任意位置 */
    #score svg {
      overflow: visible;
    }

    /* 乐谱标题：乐谱上一行靠左；名称 —— 作者，没有就不占位 */
    #scoreTitle {
      margin: 10px 16px 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: #141922;
      line-height: 1.4;
    }
    #scoreTitle[hidden] {
      display: none;
    }
    #scoreTitle .sep {
      margin: 0 6px;
      font-weight: 400;
      color: #69727f;
    }
    #scoreTitle .author {
      font-weight: 400;
      font-size: 14px;
      color: #69727f;
    }

    #scoreInner svg {
      display: block;
      margin: 10px 16px 16px;
      /* 单指平移页面（含垂直滚动）；双指由脚本做缩放 */
      touch-action: pan-x pan-y;
    }

    /* 可自由拖动的符号：整组高亮，不会拆散符杆/符尾 */
    #scoreInner svg .md-drag {
      cursor: grab;
      touch-action: none;
    }
    #scoreInner svg .md-drag:hover {
      outline: 1px dashed color-mix(in srgb, var(--sh-accent) 55%, transparent);
      outline-offset: 3px;
    }
    /* 结构锚点（音符/小节线）：锁定，仅提示不可拖 */
    /* 谱面文本统一无衬线（NotoSC 拉丁 + 中文；Bravura tspan 内联字体不受影响） */
    #scoreInner svg text {
      font-family: 'NotoSC', 'Liberation', sans-serif;
    }
    /* 文本缩放手柄（选中右下角） */
    .md-scale-handle {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--sh-accent);
      border: 2px solid #fff;
      box-shadow: 0 0 4px color-mix(in srgb, var(--sh-accent) 70%, transparent);
      cursor: nwse-resize;
      z-index: 70;
      touch-action: none;
    }
    /* 命中区往右下扩（避开符号本体，别把「拖符号」抢成「缩放」）；
       视觉仍是 12px，定位偏移不用跟着改 */
    .md-scale-handle::after {
      content: '';
      position: absolute;
      inset: -4px -16px -16px -4px;
    }
    @media (pointer: coarse) {
      .md-scale-handle::after { inset: -8px -28px -28px -8px; }
    }
    #scoreInner svg .md-lock {
      cursor: not-allowed;
      touch-action: pan-x pan-y;
    }
    #scoreInner svg .md-lock:hover {
      outline: 1px dashed color-mix(in srgb, var(--sh-danger) 50%, transparent);
      outline-offset: 2px;
    }
    /* 框选矩形 */
    .md-marquee {
      position: fixed;
      z-index: 60;
      border: 1px solid color-mix(in srgb, var(--sh-accent) 90%, transparent);
      background: color-mix(in srgb, var(--sh-accent) 8%, transparent);
      pointer-events: none;
    }
    #scoreInner svg .md-marquee-hit {
      outline: 1.5px dashed color-mix(in srgb, var(--sh-accent) 80%, transparent);
      outline-offset: 2px;
    }
    #scoreInner svg .md-drag.is-dragging {
      cursor: grabbing;
      outline: 1.5px solid color-mix(in srgb, var(--sh-accent) 90%, transparent);
      outline-offset: 3px;
    }

    /* 可点选元素（非音符、非五线谱） */
    #scoreInner svg .md-edit {
      cursor: pointer;
    }
    #scoreInner svg .md-sel {
      outline: 2px solid var(--sh-accent);
      outline-offset: 2px;
      filter: drop-shadow(0 0 3px var(--sh-accent));
    }
    #scoreInner svg .md-sel :is(path, use, rect, circle, ellipse, polygon, polyline, text) {
      fill: var(--sh-accent) !important;
      stroke: var(--sh-accent) !important;
    }
    #scoreInner svg .md-hidden {
      display: none !important;
    }

    /* 播放光标：竖线点不到（穿透），只有顶上的小球可拖 */
    #cursor {
      position: absolute;
      top: 0;
      width: 2px;
      background: var(--sh-accent);
      box-shadow: 0 0 8px color-mix(in srgb, var(--sh-accent) 55%, transparent);
      pointer-events: none;
      z-index: 4;
    }
    #cursorDot {
      position: absolute;
      top: -7px;
      left: -6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sh-accent);
      border: 2px solid #fff;
      box-shadow: 0 0 6px color-mix(in srgb, var(--sh-accent) 70%, transparent);
      pointer-events: auto;
      cursor: ew-resize;
      touch-action: none;
    }
    #cursorDot.is-dragging {
      transform: scale(1.25);
    }
    #cursor[hidden] {
      display: none;
    }

    /* 文字双击编辑的浮层输入框 */
    .md-textedit {
      position: fixed;
      z-index: 80;
      margin: 0;
      padding: 1px 4px;
      border: 1.5px solid var(--sh-accent);
      border-radius: 6px;
      background: #fff;
      color: #141922;
      font: inherit;
      box-shadow: 0 4px 14px rgba(16, 24, 40, 0.18);
    }

    /* 元素操作小工具条 */
    .md-editpop {
      position: fixed;
      z-index: 70;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 3px;
      background: rgba(22, 26, 34, 0.94);
      border-radius: 9px;
      box-shadow: 0 6px 18px rgba(10, 14, 22, 0.3);
    }
    .md-editpop[hidden] { display: none; }
    .md-editpop-row {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .md-editpop button {
      border: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .md-editpop button:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    .md-editpop button.is-danger:hover {
      background: rgba(214, 60, 60, 0.9);
    }
    /* 字体下拉：外壳自绘的 .sh-select（原生 <select> 的弹层在触屏上是系统 UI）。
       按钮落在本条 HUD 里要跟着暗色底走，所以显式覆盖主题令牌；
       选择列表挂在 body 上、用主题色，与页面其它下拉一致。 */
    .md-editpop [data-slot='face'] {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 140px;
    }
    .md-editpop .sh-select {
      width: 100%;
      height: 26px;
      padding: 0 6px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .md-editpop .sh-select:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .md-editpop .sh-select:focus-visible,
    .md-editpop .sh-select.is-open {
      border-color: rgba(120, 190, 255, 0.9);
    }
    .md-editpop .sh-select__caret {
      color: rgba(255, 255, 255, 0.7);
    }
    .md-editpop [hidden] { display: none; }

    #statusbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      font-size: 12px;
      color: var(--sh-muted);
      background: var(--sh-surface);
      border-top: 1px solid var(--sh-border);
    }
    #zoom {
      color: var(--sh-text);
      font-variant-numeric: tabular-nums;
    }
    #hint { color: var(--sh-faint); }

    /* 排版面板：每行一个文字标签 + 一条拖动条 + 百分比 */
    .sh-panel-sliders {
      min-width: 230px;
    }
    .sh-sliderrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      cursor: default;
    }
    .sh-sliderrow:hover {
      background: none;
    }
    .sh-sliderrow__label {
      flex: none;
      width: 62px;
      font-size: 12.5px;
      color: var(--sh-text);
      white-space: nowrap;
    }
    .sh-sliderrow__range {
      flex: 1 1 auto;
      min-width: 110px;
      accent-color: var(--sh-accent);
      cursor: pointer;
    }
    .sh-sliderrow__value {
      flex: none;
      width: 40px;
      text-align: right;
      font-size: 11.5px;
      color: var(--sh-muted);
      font-variant-numeric: tabular-nums;
    }

    /* 标题面板 */
    .sh-titleform {
      min-width: 230px;
      padding: 6px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .sh-titleform label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }
    .sh-titleform .k {
      flex: none;
      width: 40px;
      color: var(--sh-muted);
    }
    .sh-titleform input {
      flex: 1 1 auto;
      min-width: 0;
      padding: 5px 8px;
      border: 1px solid var(--sh-border-strong);
      border-radius: 7px;
      font: inherit;
      font-size: 12.5px;
      background: var(--sh-surface);
      color: var(--sh-text);
    }

    /* 超宽 / 竖屏：底边状态条改成无背板叠在画面上（跟这两段的其它底边控件一致），
       横向滚动改由外壳自绘拖动条接管——原生滚动条抬不到底栏上方，也做不到
       「滚动时出条、静止时出提示」的互换（见 shell/shell.css）。 */
    @media (min-aspect-ratio: 2/1), (max-aspect-ratio: 1/1) {
      #statusbar {
        background: none;
        border-top: 0;
        height: auto;
        padding: 3px 12px;
        pointer-events: none; /* 只剩文字，别挡住底下谱面点击 */
        /* 状态条是 flex 行：无背板后宽度让给文字自己撑，不锁 nowrap 的话
           文字会被 spacer 挤成一列一个字，底边凭空多出一大块 */
        white-space: nowrap;
      }
      #score {
        bottom: 0;
        scrollbar-width: none;
      }
      #score::-webkit-scrollbar { display: none; }
    }
    @media (max-aspect-ratio: 1/1) {
      /* 竖屏底栏是停靠的播放条：状态条和拖动条都抬到它上方 */
      #statusbar { bottom: calc(var(--sh-dock-bottom, 84px) + 4px); }
    }

    @media (max-width: 640px) {
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="score">
    <div id="scoreInner">
      <div id="scoreTitle" hidden>
        <span class="name"></span><span class="sep">——</span><span class="author"></span>
      </div>
      <div id="cursor" hidden><span id="cursorDot"></span></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="statusText">Verovio 引擎加载中…</span>
    <div class="sh-spacer"></div>
